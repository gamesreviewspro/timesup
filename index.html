            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #3d3d5c;
            background: #1e1e2f;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

            resize: vertical;
            min-height: 70px;
        }

        .config-group input:focus, .config-group select:focus, .config-group textarea:focus {

        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .checkbox-group input {
            width: auto;
            cursor: pointer;
        }

        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }

        .btn-success { background: #2ed573; }
        .btn-success:hover { background: #7bed9f; }

        .btn-warning { background: #ffa502; }
        .btn-warning:hover { background: #eccc68; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-group .btn { margin-top: 0; }

        .sound-toggle-btn {
            background: #34344e;
            border: 1px solid #3d3d5c;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .sound-toggle-btn:hover {
            background: #3d3d5c;
        }

        .game-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #1e1e2f;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

            justify-content: space-between;

        }

        .timer {

            color: #ffa502;

        .timer.warning {
            color: #ff4757;

        }

        @keyframes pulse {
            from { transform: scale(1); }

        .score-board {

            justify-content: space-between;

    // --- MOTEUR AUDIO COMPATIBLE SAFARI iOS SANS INTERRUPTIONS ---
    let soundEnabled = true;
    let audioCtx = null;
    let timerTickAudioPlayer = null; // Élément audio réutilisé pour le chrono iOS

    // Générateur d'ondes douces au format Data-URI (Audio PCM 8-bit doux)
    function createSoftWavURI(freq, durationMs, envelope = 'bell') {
        const sampleRate = 11025;
        const numSamples = Math.floor(sampleRate * (durationMs / 1000));
        const wavBuffer = new Uint8Array(44 + numSamples);

        wavBuffer.set([82,73,70,70], 0);
        const fileSize = 36 + numSamples;
        wavBuffer[4] = fileSize & 0xff; wavBuffer[5] = (fileSize >> 8) & 0xff;
        wavBuffer[6] = (fileSize >> 16) & 0xff; wavBuffer[7] = (fileSize >> 24) & 0xff;
        wavBuffer.set([87,65,86,69,102,109,116,32,16,0,0,0,1,0,1,0], 8);
        wavBuffer[24] = sampleRate & 0xff; wavBuffer[25] = (sampleRate >> 8) & 0xff;
        wavBuffer[28] = sampleRate & 0xff; wavBuffer[29] = (sampleRate >> 8) & 0xff;
        wavBuffer.set([1,0,8,0,100,97,116,97], 32);
        wavBuffer[40] = numSamples & 0xff; wavBuffer[41] = (numSamples >> 8) & 0xff;

        for (let i = 0; i < numSamples; i++) {
            const t = i / sampleRate;
            let gain = Math.exp(-3 * (i / numSamples)); // Atténuation douce

            if (envelope === 'soft') {
                gain = Math.sin(Math.PI * (i / numSamples)); // Cloche douce
            }

            const sample = Math.sin(2 * Math.PI * freq * t) * gain;
            wavBuffer[44 + i] = Math.floor((sample + 1) * 127.5);
        }

        let binary = '';
        for (let i = 0; i < wavBuffer.length; i++) {
            binary += String.fromCharCode(wavBuffer[i]);
        }
        return 'data:audio/wav;base64,' + btoa(binary);
    }

    // Sons doux pré-calculés
    const softSounds = {
        success: createSoftWavURI(523.25, 180, 'bell'),  // Do doux (Clochette)
        skip: createSoftWavURI(220, 100, 'soft'),        // Pop doux
        tickWarning: createSoftWavURI(600, 40, 'soft'),  // Clic métronome doux
        endTurn: createSoftWavURI(261.63, 300, 'bell')    // Carillon doux de fin
    };

    function playSoundNative(soundUri) {
        if (!soundEnabled) return;
        try {
            const audio = new Audio(soundUri);
            audio.volume = 0.5;
            audio.play().catch(() => {
                playWebAudioFallback();
            });
        } catch(e) {}
    }

    function playWebAudioFallback() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    // Déblocage universel du canal audio sur iOS Safari lors d'un clic
    function unlockIosAudioPool() {
        if (!timerTickAudioPlayer) {
            timerTickAudioPlayer = new Audio(softSounds.tickWarning);
            timerTickAudioPlayer.volume = 0.5;
        }
        try {
            timerTickAudioPlayer.play().then(() => {
                timerTickAudioPlayer.pause();
                timerTickAudioPlayer.currentTime = 0;
            }).catch(() => {});
        } catch(e) {}

        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    ['touchstart', 'touchend', 'click'].forEach(evt => {
        document.addEventListener(evt, unlockIosAudioPool, false);
    });

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerText = soundEnabled ? '🔊 Son ON' : '🔇 Son OFF';
        if (soundEnabled) unlockIosAudioPool();
    }

    function playSoundSuccess() { playSoundNative(softSounds.success); }
    function playSoundSkip() { playSoundNative(softSounds.skip); }
    
    // Bip doux du chrono des 10 dernières secondes garanti sur iOS Safari
    function playSoundTick() {
        if (!soundEnabled) return;
        if (timerTickAudioPlayer) {
            try {
                timerTickAudioPlayer.currentTime = 0;
                timerTickAudioPlayer.play().catch(() => playSoundNative(softSounds.tickWarning));
            } catch(e) {
                playSoundNative(softSounds.tickWarning);
            }
        } else {
            playSoundNative(softSounds.tickWarning);
        }
    }
    
    function playSoundEndTurn() { playSoundNative(softSounds.endTurn); }

        }
    };

    let currentLang = 'fr';
    let isExpertMode = false;
    let gameDeck = [];
    let remainingWords = [];
    let scores = { 1: 0, 2: 0 };
    let currentTeam = 1;
    let currentRound = 1;
    let timer;
    let timerConfig = 30;
    let timeLeft = 30;
    let isTurnActive = false;

    let teamPlayers = { 1: [], 2: [] };
    let playerTurnIndexes = { 1: 0, 2: 0 };
    let playerStats = {};

    function toggleExpertMode() {
        const mode = document.getElementById('mode-select').value;
        isExpertMode = (mode === 'expert');
        document.getElementById('expert-config-container').style.display = isExpertMode ? 'block' : 'none';
    }

    function toggleCustomWords() {
        const isChecked = document.getElementById('custom-words-toggle').checked;
        document.getElementById('custom-words-container').style.display = isChecked ? 'block' : 'none';
    }

    function changeLanguage() {
        currentLang = document.getElementById('lang-select').value;
        const t = translations[currentLang];

        document.getElementById('ui-subtitle').innerText = t.subtitle;
        document.getElementById('ui-label-lang').innerText = t.langLabel;
        document.getElementById('ui-label-mode').innerText = t.modeLabel;
        document.getElementById('ui-label-team1-players').innerText = t.team1PlayersLabel;
        document.getElementById('ui-label-team2-players').innerText = t.team2PlayersLabel;
        document.getElementById('ui-label-theme').innerText = t.themeLabel;
        document.getElementById('ui-label-custom-toggle').innerText = t.customToggleLabel;
        document.getElementById('custom-words-input').placeholder = t.customPlaceholder;
        document.getElementById('ui-label-count').innerText = t.countLabel;
        document.getElementById('ui-label-timer').innerText = t.timerLabel;
        document.getElementById('ui-rules-hint').innerHTML = t.rulesHint;
        document.getElementById('ui-btn-start').innerText = t.btnStart;
        document.getElementById('start-turn-btn').innerText = t.btnStartChrono;
        document.getElementById('ui-btn-skip').innerText = t.btnSkip;
        document.getElementById('ui-btn-found').innerText = t.btnFound;
        document.getElementById('ui-team1-label').innerText = t.team1;
        document.getElementById('ui-team2-label').innerText = t.team2;
        document.getElementById('ui-end-team1-label').innerText = t.team1;
        document.getElementById('ui-end-team2-label').innerText = t.team2;
        document.getElementById('ui-turn-label').innerText = t.turn;
        document.getElementById('ui-active-player-label').innerText = t.activePlayerLabel;
        document.getElementById('ui-stats-title').innerText = t.statsTitle;
        document.getElementById('ui-th-player').innerText = t.thPlayer;
        document.getElementById('ui-th-team').innerText = t.thTeam;
        document.getElementById('ui-th-score').innerText = t.thScore;

        const select = document.getElementById('theme-select');
        select.innerHTML = `
            <option value="general">${t.themeGroups.general}</option>
            <optgroup label="${t.themeGroups.fam}">
                <option value="kids">${t.themes.kids}</option>
                <option value="family">${t.themes.family}</option>
            </optgroup>
            <optgroup label="${t.themeGroups.lic}">
                <option value="harrypotter">${t.themes.harrypotter}</option>
                <option value="marvel">${t.themes.marvel}</option>
                <option value="disney">${t.themes.disney}</option>
                <option value="starwars">${t.themes.starwars}</option>
            </optgroup>
            <optgroup label="${t.themeGroups.cul}">
                <option value="travel">${t.themes.travel}</option>
                <option value="food">${t.themes.food}</option>
                <option value="music">${t.themes.music}</option>
                <option value="sports">${t.themes.sports}</option>
            </optgroup>
        `;
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
        unlockIosAudioPool();

        const countInput = parseInt(document.getElementById('word-count').value);
        const wordCount = Math.max(10, Math.min(100, countInput || 30));
        
        const timeInput = parseInt(document.getElementById('timer-length').value);
        timerConfig = Math.max(10, Math.min(90, timeInput || 30));

        const mode = document.getElementById('mode-select').value;
        isExpertMode = (mode === 'expert');
        
        if (isExpertMode) {
            const rawP1 = document.getElementById('team1-players-input').value;
            const rawP2 = document.getElementById('team2-players-input').value;

            const list1 = rawP1.split(',').map(s => s.trim()).filter(s => s.length > 0);
            const list2 = rawP2.split(',').map(s => s.trim()).filter(s => s.length > 0);

            teamPlayers[1] = list1.length > 0 ? list1 : ["Joueur 1A", "Joueur 1B"];
            teamPlayers[2] = list2.length > 0 ? list2 : ["Joueur 2A", "Joueur 2B"];

            playerTurnIndexes = { 1: 0, 2: 0 };
            playerStats = {};
            [...teamPlayers[1], ...teamPlayers[2]].forEach(p => playerStats[p] = 0);
        }

        const selectedTheme = document.getElementById('theme-select').value;
        const langData = database[currentLang];
        
        let sourceBank = [];
        if (selectedTheme === 'general') {
            sourceBank = [
                ...langData.family.slice(0, 20),
                ...langData.harrypotter.slice(0, 15),
                ...langData.marvel.slice(0, 15),
                ...langData.disney.slice(0, 15),
                ...langData.starwars.slice(0, 15),
                ...langData.travel.slice(0, 10),
                ...langData.food.slice(0, 10)
            ];
        } else {
            sourceBank = [...langData[selectedTheme]];
        }

        const useCustom = document.getElementById('custom-words-toggle').checked;
        if (useCustom) {
            const rawCustomText = document.getElementById('custom-words-input').value;
            const customList = rawCustomText.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
            if (customList.length > 0) sourceBank = [...customList, ...sourceBank];
        }

        shuffleArray(sourceBank);
        
        gameDeck = sourceBank.slice(0, Math.min(wordCount, sourceBank.length));
        remainingWords = [...gameDeck];

        scores = { 1: 0, 2: 0 };
        currentRound = 1;
        currentTeam = 1;

        updateUI();
        showScreen('game-screen');
        prepareTurn();
    }

    function getCurrentPlayerName() {
        if (!isExpertMode) return "";
        const players = teamPlayers[currentTeam];
        const idx = playerTurnIndexes[currentTeam] % players.length;
        return players[idx];
    }

    function prepareTurn() {
        const t = translations[currentLang];
        isTurnActive = false;
        timeLeft = timerConfig;

        const timerElem = document.getElementById('timer-display');
        timerElem.innerText = timeLeft + 's';
        timerElem.classList.remove('warning');

        document.getElementById('start-turn-btn').style.display = 'block';
        document.getElementById('word-display').style.display = 'none';
        document.getElementById('action-btns').style.display = 'none';
        
        const teamName = currentTeam === 1 ? t.team1 : t.team2;
        document.getElementById('current-team-display').innerText = teamName;

        if (isExpertMode) {
            document.getElementById('expert-player-banner').style.display = 'block';
            document.getElementById('current-player-name').innerText = getCurrentPlayerName();
        } else {
            document.getElementById('expert-player-banner').style.display = 'none';
        }
    }

    function startTurn() {
        if (remainingWords.length === 0) return;

        unlockIosAudioPool();

        isTurnActive = true;
        document.getElementById('start-turn-btn').style.display = 'none';
        document.getElementById('word-display').style.display = 'flex';
        document.getElementById('action-btns').style.display = 'flex';

        showCurrentWord();

        const timerElem = document.getElementById('timer-display');

        timer = setInterval(() => {
            timeLeft--;
            timerElem.innerText = timeLeft + 's';

            if (timeLeft <= 10 && timeLeft > 0) {
                timerElem.classList.add('warning');
                playSoundTick();
            } else if (timeLeft > 10) {
                timerElem.classList.remove('warning');
            }

            if (timeLeft <= 0) {
                endTurn();
            }
        }, 1000);
    }

    function showCurrentWord() {
        if (remainingWords.length > 0) {
            document.getElementById('word-display').innerText = remainingWords[0];
        }
    }

    function validateWord() {
        if (!isTurnActive) return;

        playSoundSuccess();

        scores[currentTeam]++;
        document.getElementById(`score-${currentTeam}`).innerText = scores[currentTeam];

        if (isExpertMode) {
            const activePlayer = getCurrentPlayerName();
            if (activePlayer) playerStats[activePlayer]++;
        }

        remainingWords.shift();

        if (remainingWords.length === 0) {
            endTurn(true);
        } else {
            showCurrentWord();
        }
    }

    function skipWord() {
        if (!isTurnActive || remainingWords.length <= 1) return;

        playSoundSkip();

        const skippedWord = remainingWords.shift();
        remainingWords.push(skippedWord);
        showCurrentWord();
    }

    function endTurn(deckEmpty = false) {
        const t = translations[currentLang];
        clearInterval(timer);
        isTurnActive = false;

        document.getElementById('timer-display').classList.remove('warning');

        if (!deckEmpty) {
            playSoundEndTurn();
        }

        if (isExpertMode) {
            playerTurnIndexes[currentTeam]++;
        }

        if (deckEmpty) {
            handleRoundEnd();
        } else {
            currentTeam = currentTeam === 1 ? 2 : 1;
            const nextTeamName = currentTeam === 1 ? t.team1 : t.team2;
            const nextPlayerName = isExpertMode ? ` (${getCurrentPlayerName()})` : '';
            alert(`${t.timeUpAlert} ${nextTeamName}${nextPlayerName}.`);
            prepareTurn();
        }
    }

    function handleRoundEnd() {
        const t = translations[currentLang];
        document.getElementById('end-score-1').innerText = scores[1];
        document.getElementById('end-score-2').innerText = scores[2];

        if (isExpertMode) {
            const tbody = document.getElementById('stats-table-body');
            tbody.innerHTML = '';
            
            [1, 2].forEach(teamNum => {
                teamPlayers[teamNum].forEach(player => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${player}</strong></td>
                        <td>${teamNum === 1 ? t.team1 : t.team2}</td>
                        <td>${playerStats[player] || 0}</td>
                    `;
                    tbody.appendChild(row);
                });
            });

            document.getElementById('stats-container').style.display = 'block';
        } else {
            document.getElementById('stats-container').style.display = 'none';
        }

        if (currentRound < 3) {
            document.getElementById('round-end-title').innerText = `${t.roundEndTitle} ${currentRound}`;
            document.getElementById('next-round-btn').innerText = t.nextRoundBtn;
            showScreen('round-end-screen');
        } else {
            let winnerText = t.draw;
            if (scores[1] > scores[2]) winnerText = `${t.team1} ${t.win}`;
            if (scores[2] > scores[1]) winnerText = `${t.team2} ${t.win}`;

            document.getElementById('round-end-title').innerText = `${t.victory} ${winnerText}`;
            document.getElementById('next-round-btn').innerText = t.restartBtn;
            showScreen('round-end-screen');
        }
    }

    function nextRound() {
        if (currentRound >= 3) {
            showScreen('start-screen');
            return;
        }

        currentRound++;
        remainingWords = [...gameDeck];
        shuffleArray(remainingWords);

        updateUI();
        showScreen('game-screen');
        prepareTurn();
    }

    function updateUI() {
        const t = translations[currentLang];
        document.getElementById('score-1').innerText = scores[1];
        document.getElementById('score-2').innerText = scores[2];
        document.getElementById('round-display').innerText = t.rounds[currentRound];
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    changeLanguage();
</script>
